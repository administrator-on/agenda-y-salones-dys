<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda y Salones DYS</title>
    <!-- Tailwind CSS para un diseño limpio y profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar para el manejo de la agenda -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-calendar-days text-2xl"></i>
                <h1 class="text-xl font-bold">Agenda y Salones DYS</h1>
            </div>
            <div id="connection-status" class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-200">
                <i class="fa-solid fa-circle text-yellow-400 text-[10px] mr-1"></i> Conectando a Firebase...
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Panel Lateral (Salones / Controles) -->
        <aside class="lg:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col space-y-6">
            <div>
                <h2 class="text-lg font-semibold text-slate-900 mb-2"><i class="fa-solid fa-door-open mr-2 text-indigo-600"></i>Salones Disponibles</h2>
                <p class="text-xs text-slate-500 mb-4">Selecciona un salón para filtrar o administra los espacios.</p>
                
                <!-- Lista de Salones -->
                <div id="salones-list" class="space-y-2">
                    <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-lg text-sm font-medium text-indigo-900 flex justify-between items-center">
                        <span>Salón Principal (Auditorio)</span>
                        <i class="fa-solid fa-check text-indigo-600"></i>
                    </div>
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 cursor-pointer flex justify-between items-center">
                        <span>Sala de Juntas B</span>
                        <span class="text-xs text-slate-400">Filtrar</span>
                    </div>
                </div>
            </div>

            <div class="border-t pt-4">
                <button onclick="abrirModalReserva()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-sm flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nueva Reserva</span>
                </button>
            </div>
        </aside>

        <!-- Calendario -->
        <section class="lg:col-span-3 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div id='calendar'></div>
        </section>
    </main>

    <!-- Modal para Nueva Reserva -->
    <div id="modal-reserva" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-900">Nueva Reserva de Salón</h3>
                <button onclick="cerrarModalReserva()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="form-reserva" onsubmit="guardarReserva(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Título del Evento / Motivo</label>
                    <input type="text" id="titulo-evento" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ej: Reunión de Junta Directiva">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha Inicio</label>
                        <input type="datetime-local" id="fecha-inicio" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha Fin</label>
                        <input type="datetime-local" id="fecha-fin" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Salón</label>
                    <select id="salon-evento" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Salón Principal (Auditorio)">Salón Principal (Auditorio)</option>
                        <option value="Sala de Juntas B">Sala de Juntas B</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Responsable</label>
                    <input type="text" id="responsable-evento" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Nombre del solicitante">
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="cerrarModalReserva()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm">Guardar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs (Versión compatible con CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // TUS CREDENCIALES DE FIREBASE (Configuradas)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC9U9LMBrV9OLWIMcixjRqzswxn2DXm-F4",
            authDomain: "agenda-y-salon-dys.firebaseapp.com",
            databaseURL: "https://agenda-y-salon-dys-default-rtdb.firebaseio.com",
            projectId: "agenda-y-salon-dys",
            storageBucket: "agenda-y-salon-dys.appspot.com",
            messagingSenderId: "984906360149",
            appId: "1:984906360149:web:5d9c1ffa97d7ab559e7bdc",
            measurementId: "G-K5DZ6CNZV7"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Actualizar indicador de estado
        const statusEl = document.getElementById('connection-status');
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-emerald-400 text-[10px] mr-1"></i> Conectado a Firebase`;

        let calendar;

        // Inicializar FullCalendar
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'es',
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [],
                eventClick: function(info) {
                    if (confirm(`¿Deseas eliminar la reserva: "${info.event.title}"?`)) {
                        const eventoId = info.event.id;
                        remove(ref(db, 'reservas/' + eventoId)).then(() => {
                            alert('Reserva eliminada con éxito.');
                        }).catch((error) => {
                            alert('Error al eliminar: ' + error.message);
                        });
                    }
                }
            });
            calendar.render();

            // Escuchar cambios en Realtime Database en tiempo real
            const reservasRef = ref(db, 'reservas');
            onValue(reservasRef, (snapshot) => {
                const data = snapshot.val();
                const eventos = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        eventos.push({
                            id: key,
                            title: `${item.titulo} (${item.salon})`,
                            start: item.inicio,
                            end: item.fin,
                            backgroundColor: item.salon === 'Salón Principal (Auditorio)' ? '#4f46e5' : '#0ea5e9',
                            borderColor: item.salon === 'Salón Principal (Auditorio)' ? '#4338ca' : '#0284c7'
                        });
                    });
                }
                calendar.removeAllEvents();
                calendar.addEventSource(eventos);
            });
        });

        // Funciones globales para el modal y formulario
        window.abrirModalReserva = function() {
            document.getElementById('modal-reserva').classList.remove('hidden');
        }

        window.cerrarModalReserva = function() {
            document.getElementById('modal-reserva').classList.add('hidden');
            document.getElementById('form-reserva').reset();
        }

        window.guardarReserva = function(e) {
            e.preventDefault();
            const titulo = document.getElementById('titulo-evento').value;
            const inicio = document.getElementById('fecha-inicio').value;
            const fin = document.getElementById('fecha-fin').value;
            const salon = document.getElementById('salon-evento').value;
            const responsable = document.getElementById('responsable-evento').value;

            const nuevaReservaRef = ref(db, 'reservas');
            push(nuevaReservaRef, {
                titulo,
                inicio,
                fin,
                salon,
                responsable
            }).then(() => {
                cerrarModalReserva();
                alert('¡Reserva guardada correctamente!');
            }).catch((error) => {
                alert('Hubo un error al guardar: ' + error.message);
            });
        }
    </script>
</body>
</html>
